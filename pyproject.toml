[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-generator"
version = "0.1.0"
description = "Multi-tenant career-page event ingestion gateway + synthetic driver"
requires-python = ">=3.11"
dependencies = [
    "msgspec>=0.18",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "cryptography>=42",
    "pyjwt>=2.8",
    "confluent-kafka>=2.3",
    # Runtime, not dev: `driver/replay.py` is the driver's HTTP client and ships in
    # the same image as the gateway. The compose driver service runs `pip install -e .`,
    # which installs this list and not `[dev]`, so a dev-only httpx is an
    # ImportError on the demo machine and nowhere else.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*", "contracts*", "driver*", "tools*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests", "contracts", "app", "driver", "tools", "bench"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
    "integration: requires a live Kafka broker (deselect with '-m \"not integration\"')",
    "load: throughput measurement, slow",
]
